<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}FilmClub{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-..." crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />


    <script src="https://accounts.google.com/gsi/client" async></script>
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>

    <meta name="csrf-token" content="{{ csrf_token }}">

    {% load static %}


    <style>
        body {
          background-image: url("/static/images/2147698870.jpg");
          background-size: cover;
          background-repeat: no-repeat;
          background-attachment: fixed;
          background-position: center;
        }
        main.container {
          background-color: transparent !important;
        }

        .list-group-item {
            background-color: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(4px);

        }

        .list-group-item a {
            color: black;
            text-decoration: none;
        }

        .list-group-item a:hover {
            text-decoration: underline;
            color: #333;
        }

        .navbar-brand.gradient-text {
            background: linear-gradient(to right, red, purple, blue);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        #toggle-description {
            all: unset;
            cursor: pointer;
            color: white;
            font-weight: 500;
            display: none;
            margin-top: 8px;
        }

        #toggle-description:hover {
            text-decoration: underline;
        }

        #description {
            overflow: hidden;
            max-height: 6em;
            position: relative;
            transition: max-height 0.3s ease;
        }

        #description.expanded {
            max-height: none;
        }

        .star-rating button {
            cursor: pointer;
        }

        .star-rating i {
            transition: color 0.2s;
        }

        .star-rating button:hover i,
        .star-rating button:hover ~ button i {
            color: #ffcc00;
        }

        .card.filter-glass {
            background-color: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: white;
        }

        .tag-badge {
            background-color: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(2px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .card-title {
            text-decoration-color: black;
        }

        .film-card {
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            cursor: pointer;
        }

        .film-card:hover {
          transform: scale(1.05);
          box-shadow: 0 0 10px rgba(255, 255, 255, 0.2);
        }

        .dropdown-menu {
            z-index: 20000;
        }




    </style>
</head>
<body>
    {% include "components/navigation.html" %}

    <main class="container mt-4">
        {% block content %}{% endblock %}
        {% include "components/messages.html" %}
    </main>

    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js" integrity="sha384-..." crossorigin="anonymous"></script>
    <script>
        const html = document.documentElement;
        const themeToggleBtn = document.getElementById("themeToggle");
        const savedTheme = localStorage.getItem("theme");

        if (savedTheme) {
            html.setAttribute("data-bs-theme", savedTheme);
        }

        if (themeToggleBtn) {
            themeToggleBtn.addEventListener("click", () => {
                const currentTheme = html.getAttribute("data-bs-theme");
                const newTheme = currentTheme === "dark" ? "light" : "dark";
                html.setAttribute("data-bs-theme", newTheme);
                localStorage.setItem("theme", newTheme);
            });
        }
    </script>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const toggleBtn = document.getElementById("toggle-description");
            const description = document.getElementById("description");

            if (toggleBtn && description) {
                const lineHeight = parseFloat(getComputedStyle(description).lineHeight);
                const lines = description.scrollHeight / lineHeight;

                if (lines > 3) {
                    toggleBtn.style.display = "inline-block";

                    toggleBtn.addEventListener("click", () => {
                        description.classList.toggle("expanded");
                        const expanded = description.classList.contains("expanded");
                        toggleBtn.textContent = expanded ? "Show Less" : "Show More";
                    });
                }
            }
        });
    </script>

    <script>
        document.body.addEventListener("htmx:configRequest", function (event) {
            const token = document.querySelector('meta[name="csrf-token"]')?.getAttribute("content");
            if (token) {
                event.detail.headers["X-CSRFToken"] = token;
            }
        });
    </script>
</body>
</html>
