<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}FilmClub{% endblock %}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-..." crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />


    <script src="https://accounts.google.com/gsi/client" async></script>
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>

    <meta name="csrf-token" content="{{ csrf_token }}">

    {% load static %}


    <style>
        body {
          background-image: url("/static/images/2147698870.jpg");
          background-size: cover;
          background-repeat: no-repeat;
          background-attachment: fixed;
          background-position: center;
        }
        main.container {
          background-color: transparent !important;
        }

        .minimal-title span {
          font-size: 2.2rem;
          color: black;
          background-color: rgba(255, 255, 255, 0.05);
          padding: 0.5rem 1rem;
          border-radius: 1rem;
          backdrop-filter: blur(10px);
          font-weight: 300;
        }

        .list-group-item {
            background-color: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(4px);

        }

        .list-group-item a {
            color: black;
            text-decoration: none;
        }

        .list-group-item a:hover {
            text-decoration: underline;
            color: #333;
        }

        .navbar-brand.gradient-text {
            background: linear-gradient(to right, red, purple, blue);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .navbar-search-container {
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
        }

        .search-form {
            width: 100%;
           position: relative;
        }

        #navbar-search {
          background: rgba(255, 255, 255, 0.7);
          border: 1px solid rgba(200, 200, 200, 0.3);
          backdrop-filter: blur(8px);
          color: #222;
        }

        #nav-bar-search-results {
          position: absolute;
          top: 100%;
          left: 0;
          z-index: 999;
          width: 100%;
          background: rgba(255, 255, 255, 0.6);
          backdrop-filter: blur(8px);
          border-radius: 0.5rem;
          box-shadow: 0 8px 24px rgba(0,0,0,0.1);
          max-height: 320px;
          overflow-y: auto;
          margin-top: 0.5rem;
        }

        #toggle-description {
            all: unset;
            cursor: pointer;
            color: white;
            font-weight: 500;
            display: none;
            margin-top: 8px;
        }

        #toggle-description:hover {
            text-decoration: underline;
        }

        #description {
            overflow: hidden;
            max-height: 6em;
            position: relative;
            transition: max-height 0.3s ease;
        }

        #description.expanded {
            max-height: none;
        }

        .star-rating button {
            cursor: pointer;
        }

        .star-rating i {
            transition: color 0.2s;
        }

        .star-rating button:hover i,
        .star-rating button:hover ~ button i {
            color: #ffcc00;
        }
        .glass-card {
            max-width: 500px;
            width: 100%;
            background: rgba(255, 255, 255, 0.15) !important;
            backdrop-filter: blur(12px);
            border-radius: 1rem;
            box-shadow: 0 0 24px rgba(0, 0, 0, 0.2) !important;
            color: #000;
        }

        .glass-card input {
            background-color: rgba(255, 255, 255, 0.7);
            border-radius: 0.5rem;
        }

        .glass-card h2 {
            font-weight: 600;
        }

        .logout-glass {
            max-width: 600px;
            width: 100%;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(12px);
            border-radius: 1rem;
            box-shadow: 0 0 24px rgba(0, 0, 0, 0.2);
            color: #000;
            }

        .wide-search {
            width: 700px !important;
            max-width: 100%;
        }


        .card.filter-glass {
            background-color: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: white;
        }
        .glass-container {
            max-width: 600px;
            margin: auto;
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(10px);
            border-radius: 1rem;
            padding: 2rem;
            box-shadow: 0 0 24px rgba(0, 0, 0, 0.15);
        }


        .tag-badge {
            background-color: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(2px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .card-title {
            text-decoration-color: black;
        }

        .film-card {
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            cursor: pointer;
        }

        .film-card:hover {
          transform: scale(1.05);
          box-shadow: 0 0 10px rgba(255, 255, 255, 0.2);
        }

        .dropdown-menu {
            z-index: 20000;
        }

        .add-film-button {
          position: fixed;
          bottom: 24px;
          right: 24px;
          width: 60px;
          height: 60px;
          border-radius: 50%;
          background: #111;
          color: white;
          font-size: 36px;
          font-weight: bold;
          border: none;
          box-shadow: 0 0 12px rgba(0, 0, 0, 0.3);
          z-index: 1055;
          transition: background 0.3s;
        }

        .add-film-button:hover {
          background: #333;
          cursor: pointer;
        }

        .add-film-button span {
          display: inline-block;
          transform: translateY(-2px);
        }


    </style>
</head>
<body>
    {% include "components/navigation.html" %}

    <main class="container mt-4">
        {% block content %}{% endblock %}
        {% include "components/messages.html" %}
    </main>


    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js" integrity="sha384-..." crossorigin="anonymous"></script>
    <script>
        const html = document.documentElement;
        const themeToggleBtn = document.getElementById("themeToggle");
        const savedTheme = localStorage.getItem("theme");

        if (savedTheme) {
            html.setAttribute("data-bs-theme", savedTheme);
        }

        if (themeToggleBtn) {
            themeToggleBtn.addEventListener("click", () => {
                const currentTheme = html.getAttribute("data-bs-theme");
                const newTheme = currentTheme === "dark" ? "light" : "dark";
                html.setAttribute("data-bs-theme", newTheme);
                localStorage.setItem("theme", newTheme);
            });
        }
    </script>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const toggleBtn = document.getElementById("toggle-description");
            const description = document.getElementById("description");

            if (toggleBtn && description) {
                const lineHeight = parseFloat(getComputedStyle(description).lineHeight);
                const lines = description.scrollHeight / lineHeight;

                if (lines > 3) {
                    toggleBtn.style.display = "inline-block";

                    toggleBtn.addEventListener("click", () => {
                        description.classList.toggle("expanded");
                        const expanded = description.classList.contains("expanded");
                        toggleBtn.textContent = expanded ? "Show Less" : "Show More";
                    });
                }
            }
        });
    </script>

    <script>
        document.body.addEventListener("htmx:configRequest", function (event) {
            const token = document.querySelector('meta[name="csrf-token"]')?.getAttribute("content");
            if (token) {
                event.detail.headers["X-CSRFToken"] = token;
            }
        });
    </script>

    <script>
      document.addEventListener("DOMContentLoaded", function () {
        const coverInput = document.getElementById("id_cover_url");
        const coverPreview = document.getElementById("coverPreview");

        if (coverInput && coverPreview) {
          coverInput.addEventListener("input", () => {
            const url = coverInput.value;
            if (url && url.startsWith("http")) {
              coverPreview.src = url;
              coverPreview.style.display = "block";
            } else {
              coverPreview.style.display = "none";
            }
          });
        }
      });
    </script>

</body>
</html>
