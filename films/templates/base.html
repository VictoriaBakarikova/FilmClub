<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}FilmClub{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <script src="https://accounts.google.com/gsi/client" async></script>
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
    <style>
        .navbar-brand.gradient-text {
    background: linear-gradient(to right, red, purple, blue);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}
        #toggle-description {
            all: unset;
            cursor: pointer;
            color: white;
            font-weight: 500;
            display: none;
            margin-top: 8px;
        }

        #toggle-description:hover {
            text-decoration: underline;
        }

        #description {
            overflow: hidden;
            max-height: 6em;
            position: relative;
            transition: max-height 0.3s ease;
        }

        #description.expanded {
            max-height: none;
        }

        .fade-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 3em;
            background: linear-gradient(to top, #fff, transparent);
            pointer-events: none;
        }
    </style>
</head>
<body>
    {% include "components/navigation.html" %}
    <main class="container">
        {% block content %}{% endblock %}
        {% block footer %}
            {% include "components/top_films.html" %}
        {% endblock footer %}
    </main>



    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js" integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO" crossorigin="anonymous"></script>
    <script>
        const html = document.documentElement;
        const themeToggleBtn = document.getElementById("themeToggle");
        const savedTheme = localStorage.getItem("theme");
        if (savedTheme) {
            html.setAttribute("data-bs-theme", savedTheme)
        }
        themeToggleBtn.addEventListener("click", () => {
            const currentTheme = html.getAttribute("data-bs-theme");
            const newTheme = currentTheme === "dark" ? "light" : "dark"
            html.setAttribute("data-bs-theme", newTheme);
            localStorage.setItem("theme", newTheme);
        });

        document.addEventListener("DOMContentLoaded", function () {
            const toggleBtn = document.getElementById("toggle-description");
            const description = document.getElementById("description");

            if(toggleBtn && description) {
                const lineHeight = parselFloat(getComputedStyle(description).lineHeight);
                const lines = description.scrollHeight / lineHeight;
                 if (lines > 3) {
                     toggleBtn.style.display = "inline-block";

                 toggleBtn.addEventListener("click", () => {
                     description.classList.toggle("expanded");
                     const expanded = description.classList.contains("expanded");
                     toggleBtn.textContent = expanded ? "Show Less" : "Shw More";
                 })
            }
        }
    })

                const expanded = description.classList.contains("expanded");
                toggleBtn.textContent = expanded ? "Show Less" : "Show More";

                });

    </script>
</body>

</html>
