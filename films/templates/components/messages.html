{% if messages %}
  <div class="position-fixed bottom-0 end-0 p-3" style="...">
    {% for message in messages %}
      <div
        class="toast show text-bg-success"
        role="alert"
        aria-live="assertive"
        aria-atomic="true"
        data-bs-delay="3000"
        data-bs-autohide="true"
      >
        <div class="d-flex">
          <div class="toast-body">
            {{ message }}
          </div>
          <button
            type="button"
            class="btn-close btn-close-white me-2 m-auto"
            data-bs-dismiss="toast"
            aria-label="Close"
            ></button>
        </div>
      </div>
    {% endfor %}
  </div>
{% endif %}
